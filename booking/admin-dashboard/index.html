<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 홈 | 별빛민박</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #101a2e;
    --navy-deep: #0b1220;
    --gold: #f2c14e;
    --bg-alt: #f6f4ee;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Gowun Dodum", "Apple SD Gothic Neo", sans-serif;
    background: var(--bg-alt);
    color: #1c2233;
  }
  header {
    background: var(--navy-deep);
    color: #fff;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 {
    font-family: "Jua", sans-serif;
    font-size: 1.25rem;
    margin: 0;
    font-weight: normal;
  }
  header button {
    background: transparent;
    color: #fff;
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 8px;
    padding: 8px 14px;
    font-weight: 700;
    cursor: pointer;
    font-size: 0.85rem;
  }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 24px;
  }
  .lead {
    text-align: center;
    color: #666;
    margin-bottom: 32px;
  }
  .menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
  }
  .menu-card {
    display: block;
    background: #fff;
    border: 1px solid #e3e3e3;
    border-radius: var(--radius);
    padding: 28px 24px;
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .menu-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 24px rgba(16, 26, 46, 0.12);
  }
  .menu-card .icon { font-size: 1.8rem; margin-bottom: 12px; color: var(--gold); }
  .menu-card h2 {
    font-family: "Jua", sans-serif;
    font-weight: normal;
    font-size: 1.1rem;
    color: var(--navy);
    margin: 0 0 8px;
  }
  .menu-card p {
    font-size: 0.88rem;
    color: #777;
    margin: 0;
    line-height: 1.5;
  }
</style>
</head>
<body>

<header>
  <h1>★ 별빛민박 관리자</h1>
  <button id="logoutBtn">로그아웃</button>
</header>

<main>
  <p class="lead">관리할 항목을 선택하세요.</p>
  <div class="menu-grid">
    <a class="menu-card" href="/booking/admin/schedule">
      <div class="icon">★</div>
      <h2>예약 스케줄</h2>
      <p>월별 캘린더로 예약 현황을 확인하고, 가예약을 취소 처리할 수 있습니다.</p>
    </a>
    <a class="menu-card" href="/booking/admin/rooms">
      <div class="icon">★</div>
      <h2>객실 관리</h2>
      <p>객실 이름, 설명, 인원, 가격, 사진, 노출 여부를 수정할 수 있습니다.</p>
    </a>
    <a class="menu-card" href="/booking/admin/gallery">
      <div class="icon">★</div>
      <h2>갤러리 관리</h2>
      <p>홈페이지 갤러리 섹션에 표시되는 사진을 추가하거나 삭제할 수 있습니다.</p>
    </a>
    <a class="menu-card" href="/booking/admin/price-table">
      <div class="icon">★</div>
      <h2>요금 안내 관리</h2>
      <p>홈페이지 요금 안내 표의 객실별 시즌 요금과 인원을 수정할 수 있습니다.</p>
    </a>
  </div>
</main>

<script>
document.getElementById('logoutBtn').addEventListener('click', async () => {
  await fetch('/booking/api/admin/logout', { method: 'POST' });
  location.href = '/booking/admin/login';
});
</script>
</body>
</html>
